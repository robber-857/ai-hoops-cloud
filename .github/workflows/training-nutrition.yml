name: Training and nutrition

on:
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/training-nutrition.yml"
  push:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/training-nutrition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-nutrition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / full suite and base migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: training_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ai_hoops_p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training_ci -d ai_hoops_p2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://training_ci:disposable_ci_only@127.0.0.1:5432/ai_hoops_p2_test
      PLAYER_PROFILE_TEST_DATABASE_URL: postgresql+psycopg://training_ci:disposable_ci_only@127.0.0.1:5432/ai_hoops_p2_test
      JWT_SECRET_KEY: synthetic_backend_ci_access_key
      JWT_REFRESH_SECRET_KEY: synthetic_backend_ci_refresh_key
    defaults:
      run:
        working-directory: server
    steps:
      # Official action release tags were checked on 2026-10-04; immutable SHAs
      # prevent a later tag change from altering this test pipeline.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-data.txt
            server/requirements-dev.txt
      - name: Install backend test and AFCD parsing dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Download and verify official AFCD Release 3
        run: python -m tools.fetch_training_food_sources
      - name: Verify fresh base to 0012 migration
        run: python -m tools.migrate_training_test_db
      - name: Run complete backend suite with zero skips
        run: python -m tools.run_ci_tests

  frontend-e2e:
    name: Frontend / unit, types, build and browser flow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: training_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ai_hoops_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training_ci -d ai_hoops_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://training_ci:disposable_ci_only@127.0.0.1:5432/ai_hoops_e2e_test
      JWT_SECRET_KEY: synthetic_browser_ci_access_key
      JWT_REFRESH_SECRET_KEY: synthetic_browser_ci_refresh_key
      CORS_ORIGINS: '["http://127.0.0.1:3123","http://localhost:3123"]'
      SMTP_HOST: 127.0.0.1
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3123
      API_BASE_URL: http://127.0.0.1:8123/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8123/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-data.txt
            server/requirements-dev.txt
      - name: Install exact frontend lockfile dependencies
        run: npm ci
      - name: Frontend unit tests
        run: |
          mkdir -p ../tmp
          npm test -- --reporter=default --reporter=json --outputFile=../tmp/frontend-unit-results.json
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("../tmp/frontend-unit-results.json", "utf8"));
          // The committed HEAD suite has 161 tests; unrelated local tests are excluded.
          if (report.success !== true || report.numTotalTests < 161 ||
              report.numPendingTests !== 0 || (report.numTodoTests ?? 0) !== 0 ||
              report.testResults.some(file => file.assertionResults.some(test => test.status !== "passed"))) {
            throw new Error("Frontend CI requires the full unit suite with zero skipped/todo tests.");
          }
          console.log(`Strict frontend CI: ${report.numTotalTests} passed, zero skips.`);
          JS
      - name: Frontend type check
        run: npx tsc --noEmit
      - name: Browser test type check
        run: npm run typecheck:e2e
      - name: Browser test and configuration lint
        run: npx eslint e2e playwright.config.ts
      - name: Production webpack build
        run: npm run build -- --webpack
      - name: Install isolated browser backend dependencies
        working-directory: server
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare official food data and fresh browser schema
        working-directory: server
        run: |
          python -m tools.fetch_training_food_sources
          python -m tools.migrate_training_test_db
          python -m tools.seed_training_e2e --output ../tmp/training-e2e-fixture.json
          echo "AI_HOOPS_E2E_FIXTURE=${GITHUB_WORKSPACE}/tmp/training-e2e-fixture.json" >> "$GITHUB_ENV"
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Start isolated test API
        working-directory: server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8123 > ../tmp/training-e2e-api.log 2>&1 &
          echo "TRAINING_E2E_API_PID=$!" >> "$GITHUB_ENV"
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8123/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise SystemExit("Isolated E2E API did not become healthy.")
          PY
      - name: Browser Profile, coach publication and parent food/recovery flow
        run: |
          npm run test:e2e
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("e2e/.artifacts/junit.xml").getroot()
          cases = report.findall(".//testcase")
          if len(cases) < 3 or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Browser CI requires all three scenarios with zero skips/failures.")
          print(f"Strict browser CI: {len(cases)} passed, zero skips.")
          PY
      - name: Stop this job's test API
        if: always()
        run: |
          if [ -n "${TRAINING_E2E_API_PID:-}" ]; then
            kill "$TRAINING_E2E_API_PID" || true
          fi
      - name: Upload browser failure evidence only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: training-nutrition-browser-failure-${{ github.run_id }}
          path: |
            web/e2e/.artifacts/
            tmp/training-e2e-api.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          # Never upload tmp fixture credentials, source workbooks or DB backups.
